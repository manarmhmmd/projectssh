<!DOCTYPE html>
<html>
<head>
    <title>Simple Payment</title>
</head>
<body>

    <h2>Payment Information</h2>
    
    <!-- Replace "/process-payment" with your backend link -->
    <form action="/process-payment" method="POST">
        
        <!-- Cardholder Name -->
        <div>
            <label for="cardname">Cardholder Name:</label><br>
            <input type="text" id="cardname" name="cardname" required>
        </div>
        
        <br>
        
        <!-- Card Number -->
        <div>
            <label for="cardnumber">Card Number:</label><br>
            <input type="text" id="cardnumber" name="cardnumber" placeholder="1234 5678 1234 5678" maxlength="19" required>
        </div>
        
        <br>
        
        <!-- Expiry Date and CVV -->
        <div>
            <label for="expiry">Expiry Date (MM/YY):</label><br>
            <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" style="width: 80px;" required>
        </div>
        
        <br>
        
        <div>
            <label for="cvv">CVV:</label><br>
            <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4" style="width: 60px;" required>
        </div>
        
        <br>
        
        <!-- Submit Button -->
        <button type="submit">Pay Now</button>
        
    </form>

</body>
</html>
